<style>

input,select{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;background:white;color:var(--ink);font:inherit;outline:none}input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #dbeafe}.field{display:grid;gap:6px}.field label{font-size:13px;color:#475569;font-weight:700}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.result{background:var(--blue-soft);border:1px solid #bfdbfe;border-radius:14px;padding:15px}.result .value{font-size:24px;font-weight:850;font-variant-numeric:tabular-nums}.btn{border:0;border-radius:10px;background:var(--blue);color:white;font-weight:800;padding:11px 14px;cursor:pointer}.btn.secondary{background:#e2e8f0;color:#334155}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chart{width:100%;height:190px;display:block}.chart-note{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--blue)}.dot.high{background:#d97706}.dot.price{background:#0f766e}.notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:12px 14px;border-radius:12px;font-size:13px}.muted-box{background:#f8fafc;border-radius:12px;padding:13px}.small{font-size:12px;color:var(--sub)}.up{color:var(--red)}.down{color:var(--green)}.empty{padding:16px;border-radius:12px;background:#f8fafc;color:var(--sub);font-size:13px}footer{max-width:1200px;margin:auto;padding:0 22px 32px;color:var(--sub);font-size:12px}

<body>
<header>
  <div><h1>0050 進出場決策儀表板</h1><div class="sub">把行情轉成可執行的分批策略；先看風險，再決定投入金額。</div></div>
  <div class="header-right"><span class="tag" id="data-status">正在讀取行情資料…</span></div>
</header>
<main id="app">
  <section class="card span12"><div class="empty">正在載入 data.js…</div></section>
</main>
<footer>
  本頁為個人策略試算工具，不構成投資建議。回檔幅度、均線及停利價格是觀察條件，不保證反彈或獲利。請先確認資料日期、ETF 分割調整與交易成本。紅漲綠跌為臺灣市場常見配色。
</footer>
<script src="data.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const fmt=(n,d=2)=>Number.isFinite(n)?n.toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const money=n=>Number.isFinite(n)?Math.round(n).toLocaleString('zh-TW'):'—';
const pct=n=>Number.isFinite(n)?(n>0?'+':'')+(n*100).toFixed(2)+'%':'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeNum=(v,def=0)=>Number.isFinite(Number(v))?Number(v):def;
const loadSaved=(k,d)=>{try{const v=localStorage.getItem('0050-'+k);return v===null?d:v}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem('0050-'+k,v)}catch(e){}};
const D=window.DATA;
if(!D || !Array.isArray(D.tw) || !D.tw.length){
  $('data-status').textContent='找不到 data.js';
  $('app').innerHTML='<section class="card span12"><h2>無法載入行情資料</h2><p>這個 index.html 需要與原本的 <code>data.js</code> 放在同一個資料夾。請先執行原專案的 <code>python update_data.py</code> 產生資料檔，再重新整理。</p><p class="small">若你是直接在 GitHub Pages 開啟，請確認 data.js 已提交到同一個發布分支，且檔名大小寫完全一致。</p></section>';
  return;
}
const tw=D.tw.filter(x=>Number.isFinite(+x.c)&&x.d).slice().sort((a,b)=>a.d.localeCompare(b.d));
if(!tw.length){$('data-status').textContent='0050 資料格式不完整';return}
const latest=tw[tw.length-1], prev=tw.length>1?tw[tw.length-2]:latest;
const dateDays=n=>tw.slice(Math.max(0,tw.length-n));
const mean=arr=>arr.length?arr.reduce((s,x)=>s+(+x.c),0)/arr.length:NaN;
const highOf=arr=>Math.max.apply(null,arr.map(x=>+x.h||+x.c));
const lowOf=arr=>Math.min.apply(null,arr.map(x=>+x.l||+x.c));
const high1y=highOf(dateDays(252)), low1y=lowOf(dateDays(252));
const allHigh=highOf(tw), drawdown=latest.c/high1y-1, allDraw=latest.c/allHigh-1;
const ma20=mean(dateDays(20)),ma60=mean(dateDays(60)),ma120=mean(dateDays(120));
const ret1=latest.c/prev.c-1;
const history=tw.slice(-90);
const recentHigh=highOf(dateDays(20));
const trendScore=(latest.c>ma20?1:0)+(latest.c>ma60?1:0)+(ma20>ma60?1:0);
let trendLabel=trendScore===3?'短中期趨勢偏強':trendScore===2?'趨勢訊號混合':trendScore===1?'趨勢偏弱，仍需觀察':'短中期趨勢偏弱';
let signal='觀察等待', signalClass='', reason='價格位置與均線訊號尚未形成明確優勢。';
if(drawdown<=-.15 && latest.c<ma60){signal='深度回檔：分批評估';signalClass='green';reason='距近一年高點回檔已達 15% 以上，但仍低於 60 日均線；只宜按預先設定的分批預算評估，不能假設已見底。';}
else if(drawdown<=-.10){signal='回檔區：分批觀察';signalClass='green';reason='距近一年高點回檔達 10% 以上，可檢查基本策略與資金配置，再考慮小額分批。';}
else if(drawdown<=-.05){signal='進入觀察區';signalClass='';reason='距近一年高點回檔達 5% 以上，先觀察均線與市場趨勢，不必一次投入。';}
else if(latest.c>ma20 && latest.c>ma60 && drawdown>-.03){signal='接近高檔：避免追價';signalClass='red';reason='價格仍接近近一年高點且站在短中期均線上方；若要買，應遵守分批上限，避免因上漲而追高。';}
const buyBands=[
 {label:'第一批｜回檔 5%',dd:-.05,tag:'初步觀察'},
 {label:'第二批｜回檔 10%',dd:-.10,tag:'分批評估'},
 {label:'第三批｜回檔 15%',dd:-.15,tag:'較深回檔'}
];
const defaultBudget=loadSaved('budget','100000'),defaultReserve=loadSaved('reserve','30000');
const defaultTranche=loadSaved('tranche','25'),defaultCost=loadSaved('cost',''),defaultShares=loadSaved('shares',''),defaultTarget=loadSaved('target','15');
// ===== 美股連動預估（迴歸）與進場時段 =====
function buildForecast(){
 const KEYS=['spx','ixic','sox','tsm'], NAMES={spx:'S&P 500',ixic:'那斯達克',sox:'費城半導體',tsm:'台積電 ADR'};
 if(!D.us||!KEYS.every(k=>Array.isArray(D.us[k])&&D.us[k].length>30)||tw.length<60) return null;
 const ret={};
 KEYS.forEach(k=>{ret[k]={};const a=D.us[k];for(let i=1;i<a.length;i++)ret[k][a[i].d]=a[i].c/a[i-1].c-1;});
 const usDates=Object.keys(ret.spx).filter(d=>KEYS.every(k=>ret[k][d]!==undefined)).sort();
 const U=usDates[usDates.length-1];
 function solve(A,b){const n=b.length;for(let i=0;i<n;i++){let p=i;for(let j=i+1;j<n;j++)if(Math.abs(A[j][i])>Math.abs(A[p][i]))p=j;[A[i],A[p]]=[A[p],A[i]];[b[i],b[p]]=[b[p],b[i]];
  for(let j=i+1;j<n;j++){const m=A[j][i]/A[i][i];for(let k=i;k<n;k++)A[j][k]-=m*A[i][k];b[j]-=m*b[i];}}
  const x=new Array(n);for(let i=n-1;i>=0;i--){let v=b[i];for(let j=i+1;j<n;j++)v-=A[i][j]*x[j];x[i]=v/A[i][i];}return x;}
 function ols(X,y){const n=X.length,k=X[0].length,A=[],b=[];let tr=0;
  for(let i=0;i<k;i++){A.push(new Array(k).fill(0));b.push(0);}
  for(let r=0;r<n;r++)for(let i=0;i<k;i++){b[i]+=X[r][i]*y[r];for(let j=0;j<k;j++)A[i][j]+=X[r][i]*X[r][j];}
  for(let i=1;i<k;i++)tr+=A[i][i];const lam=0.05*tr/(k-1);for(let i=1;i<k;i++)A[i][i]+=lam;
  const beta=solve(A,b);let sse=0,sst=0;const my=y.reduce((a,c)=>a+c,0)/n;
  for(let r=0;r<n;r++){let p=0;for(let i=0;i<k;i++)p+=beta[i]*X[r][i];sse+=(y[r]-p)**2;sst+=(y[r]-my)**2;}
  return {beta,sigma:Math.sqrt(sse/Math.max(1,n-k)),r2:1-sse/sst,n};}
 const X=[],yR=[],yG=[],dLow=[],dHigh=[];let ptr=0;
 for(let i=1;i<tw.length;i++){
  const d=tw[i].d;while(ptr<usDates.length&&usDates[ptr]<d)ptr++;
  const u=usDates[ptr-1];if(!u)continue;
  const p=+tw[i-1].c,r=tw[i].c/p-1;
  X.push([1].concat(KEYS.map(k=>ret[k][u])));yR.push(r);yG.push(tw[i].o/p-1);
  dLow.push(tw[i].l/p-1-r);dHigh.push(tw[i].h/p-1-r);
 }
 if(X.length<60)return null;
 const med=a=>{const s=a.slice().sort((x,y)=>x-y);return s[Math.floor(s.length/2)]};
 const mR=ols(X,yR),mG=ols(X,yG);
 const xNow=[1].concat(KEYS.map(k=>ret[k][U]));
 const pred=(m,x)=>m.beta.reduce((a,c,i)=>a+c*x[i],0);
 const pR=pred(mR,xNow),pG=pred(mG,xNow),sig=mR.sigma;
 let base=null,actual=null;
 for(const r of tw){if(r.d<=U)base=r;else if(!actual)actual=r;}
 if(!base)return null;
 const pc=+base.c,predClose=pc*(1+pR),predLow=pc*(1+Math.min(pR,pG)+med(dLow)),predHigh=pc*(1+Math.max(pR,pG)+med(dHigh));

 const spark=vals=>{const mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>(i*100/(vals.length-1)).toFixed(1)+','+(28-(v-mn)/rg*26).toFixed(1)).join(' ');
  const c=vals[vals.length-1]>=vals[0]?'#c2413b':'#16845b';
  return `<svg viewBox="0 0 100 30" preserveAspectRatio="none"><polyline fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke" points="${pts}"/></svg>`;};
 const cc=v=>v>0?'up':v<0?'down':'';

 // 區間圖
 let lo=Math.min(predLow/pc-1,pR-sig)-.003,hi=Math.max(predHigh/pc-1,pR+sig)+.003;
 if(actual){lo=Math.min(lo,actual.l/pc-1-.003);hi=Math.max(hi,actual.h/pc-1+.003);}
 const X0=v=>10+(v-lo)/(hi-lo)*380;
 const svg=`<svg viewBox="0 0 400 78" width="100%" role="img" aria-label="預估高低區間">
  <rect x="${X0(pR-sig)}" y="26" width="${X0(pR+sig)-X0(pR-sig)}" height="16" rx="4" fill="#dbeafe"/>
  <line x1="10" x2="390" y1="34" y2="34" stroke="#e2e8f0"/>
  <line x1="${X0(0)}" x2="${X0(0)}" y1="18" y2="50" stroke="#64748b" stroke-dasharray="3 3"/>
  <line x1="${X0(pR)}" x2="${X0(pR)}" y1="20" y2="48" stroke="#2563eb" stroke-width="3"/>
  <circle cx="${X0(predLow/pc-1)}" cy="34" r="5" fill="#16845b"/><circle cx="${X0(predHigh/pc-1)}" cy="34" r="5" fill="#c2413b"/>
  ${actual?`<rect x="${X0(actual.l/pc-1)}" y="54" width="${Math.max(2,X0(actual.h/pc-1)-X0(actual.l/pc-1))}" height="6" rx="2" fill="#64748b" opacity=".55"/>`:''}
  <text x="${X0(0)}" y="12" font-size="10" text-anchor="middle" fill="#64748b">前收 ${fmt(pc)}</text>
  <text x="${X0(predLow/pc-1)}" y="75" font-size="10" text-anchor="middle" fill="#16845b">低 ${fmt(predLow)}</text>
  <text x="${X0(predHigh/pc-1)}" y="75" font-size="10" text-anchor="middle" fill="#c2413b">高 ${fmt(predHigh)}</text></svg>`;

 // 進場時段
 const reg=pG<-.004?'dn':pG>.004?'up':'flat',regTxt={dn:'預期開低',flat:'預期平盤附近',up:'預期開高'}[reg];
 const H=D.intraday&&D.intraday[reg];
 const tl=i=>{const h=9+Math.floor(i/2),m=i%2?'30':'00',e=i%2?(h+1)+':00':h+':30';return h+':'+m+'–'+e};
 const topIdx=a=>a.map((v,i)=>[v,i]).sort((x,y)=>y[0]-x[0]).slice(0,2).map(x=>x[1]);
 const tbars=(a,top)=>{const mx=Math.max(...a)||1;return `<div class="tbars">${a.map((v,i)=>`<div class="${top.includes(i)?'top':''}" style="height:${v/mx*100}%" title="${tl(i)}：${v} 天"></div>`).join('')}</div><div class="tlbl">${a.map((v,i)=>`<span>${9+Math.floor(i/2)}${i%2?'.5':''}</span>`).join('')}</div>`;};

 // 結合「回檔位置」與「今日預估」的綜合判讀
 const weak=pR<=-.003,strong=pR>=.003;
 let combo;
 if(drawdown<=-.05) combo=weak?'已回檔，但今日美股訊號仍偏弱：先別一次買，等「最常出現最低點」時段附近再投入第一批。':strong?'已回檔，且今日預期偏強：若計畫要買，可在開盤後先小額買第一批，不必等太久。':'已回檔，今日訊號中性：照分批計畫進行即可。';
 else if(drawdown>-.03&&latest.c>ma20&&latest.c>ma60) combo=strong?'股價接近高檔且預期開高：避免追價，等回檔再評估。':weak?'股價在高檔，今日預期回檔：等回檔後再評估，不急著進場。':'股價在高檔，訊號中性：維持觀望或小額定期定額。';
 else combo=weak?'今日預期偏弱：若要進場，可等低點時段再分批。':strong?'今日預期偏強：不建議追價，等回檔較穩。':'今日訊號中性：沒有時機優勢，照原計畫分批。';

 let timing='';
 if(H&&H.n>=5){const tL=topIdx(H.low),tH=topIdx(H.high);
  timing=`<div class="row"><span>最常出現最低點</span><strong class="down">${tL.map(tl).join('、')}</strong></div>
  <div class="row"><span>最常出現最高點</span><strong class="up">${tH.map(tl).join('、')}</strong></div>
